name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: >
        Minimal steps to see the bug — a code snippet, a small repro project, or steps against
        one of the sample pages.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      description: Which package(s) and version(s) — e.g. Formidable.Blazor 0.1.0-preview.1.
    validations:
      required: true
  - type: checkboxes
    id: sample-repro
    attributes:
      label: Sample reproduction
      description: The sample app (`samples/Formidable.Sample`) is the fastest way to confirm a bug isn't specific to your app's setup.
      options:
        - label: This is reproducible on `/workout` or another sample page.
          required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: .NET version, browser, anything else that might be relevant.
    validations:
      required: false
