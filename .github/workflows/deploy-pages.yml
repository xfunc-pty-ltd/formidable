name: Deploy Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLISH_DIR: artifacts/pages
  SITE_DIR: artifacts/pages/wwwroot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Publish the hosted-demo build
        run: dotnet publish samples/Formidable.Sample -c Release -p:HostedDemo=true -o ${{ env.PUBLISH_DIR }}
      - name: Rewrite base href for the project page path
        run: sed -i 's#<base href="/" />#<base href="/formidable/" />#' "${{ env.SITE_DIR }}/index.html"
      - name: Add the SPA 404 fallback
        run: cp "${{ env.SITE_DIR }}/index.html" "${{ env.SITE_DIR }}/404.html"
      - name: Add .nojekyll
        run: touch "${{ env.SITE_DIR }}/.nojekyll"
      - name: Archive the Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "${{ env.SITE_DIR }}" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Upload the Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
