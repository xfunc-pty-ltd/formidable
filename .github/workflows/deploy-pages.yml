name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLISH_DIR: artifacts/pages
  SITE_DIR: artifacts/pages/wwwroot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Publish the hosted-demo build
        run: dotnet publish samples/Formidable.Sample -c Release -p:HostedDemo=true -o ${{ env.PUBLISH_DIR }}
      - name: Rewrite base href for the project page path
        run: sed -i 's#<base href="/" />#<base href="/formidable/" />#' "${{ env.SITE_DIR }}/index.html"
      - name: Add the SPA 404 fallback
        run: cp "${{ env.SITE_DIR }}/index.html" "${{ env.SITE_DIR }}/404.html"
      - name: Add .nojekyll
        run: touch "${{ env.SITE_DIR }}/.nojekyll"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
