name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A deployment environment, so a pushed tag is a request to publish rather than the act of
    # publishing: the job waits for the reviewers configured on the environment, and takes its
    # nuget.org key from that environment rather than from a repository-wide secret. Until the
    # environment exists in the repository settings the job cannot start at all, which is the
    # intended posture for a project that must stay incapable of publishing by accident.
    environment: nuget-org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release -p:ContinuousIntegrationBuild=true
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/Formidable -c Release --no-build -o artifacts
      - run: dotnet pack src/Formidable.Blazor -c Release --no-build -o artifacts
      - run: dotnet pack src/Formidable.AspNetCore -c Release --no-build -o artifacts
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicates
