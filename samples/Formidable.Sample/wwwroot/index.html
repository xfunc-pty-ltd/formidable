<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Formidable Sample</title>
    <meta property="og:title" content="Formidable live demo: form validation for Blazor" />
    <meta property="og:description" content="Try Formidable in your browser: validation profiles, progressive disclosure, row-stable collections and async rules, one page each, on FluentValidation." />
    <meta property="og:image" content="https://xfunc-pty-ltd.github.io/formidable/social-preview.png" />
    <meta property="og:url" content="https://xfunc-pty-ltd.github.io/formidable/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Formidable live demo: form validation for Blazor" />
    <meta name="twitter:description" content="Try Formidable in your browser: validation profiles, progressive disclosure, row-stable collections and async rules, one page each, on FluentValidation." />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <style>
        #blazor-error-ui {
            color-scheme: light only;
            background: lightyellow;
            color: #1f2937;
            bottom: 0;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            display: none;
            left: 0;
            padding: 0.6rem 1.25rem 0.7rem 1.25rem;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot" role="status">
            <div class="boot-spinner" aria-hidden="true"></div>
            <p>Loading the Formidable sample…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="sample.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
