# git-cliff configuration -- generates CHANGELOG.md from conventional commits.
# Regenerated at release time; see docs/releasing.md.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog 1.1.0](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/) (pre-1.0: the
`0.MINOR.PATCH` surface can still move).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/xfunc/formidable/commit/{{ commit.id }}){% for f in commit.footers %}{% if f.separator == " #" %}, #{{ f.value }}{% elif f.value is starting_with("#") %}, {{ f.value }}{% endif %}{% endfor %})
{%- endfor %}
{% endfor %}
"""
footer = """

<!-- publish-day: verify -->
{%- for release in releases %}
{% if release.version %}[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/xfunc/formidable/releases/tag/{{ release.version }}{% else %}[Unreleased]: https://github.com/xfunc/formidable/commits/main{% endif %}
{%- endfor %}"""
postprocessors = [
  { pattern = '#([0-9]+)', replace = "[#${1}](https://github.com/xfunc/formidable/issues/${1})" },
]

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^refactor|^style|^test|^build|^chore|^ci", skip = true },
]
